<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>8月26日のまとめプリント</title>
  <style>
@page { size: A4 portrait; margin: 10mm; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #ece7df;
  color: #1f2933;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
.sheet {
  width: 210mm;
  min-height: 297mm;
  height: 297mm;
  margin: 0 auto 8mm;
  padding: 10mm;
  background: #fff;
  display: flex;
  flex-direction: column;
  page-break-after: always;
  break-after: page;
}
.sheet:last-child { page-break-after: auto; break-after: auto; }
.sheet-head {
  border-bottom: 2px solid #c44738;
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.brand { font-size: 10px; letter-spacing: 0.18em; color: #c44738; font-weight: 700; }
.title { font-size: 16px; margin: 2px 0 6px; font-weight: 700; }
.meta-print {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #1f2933;
}
.body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.row {
  display: grid;
  gap: 8px;
  page-break-inside: avoid;
  break-inside: avoid;
}
.row.cols-1 { grid-template-columns: 1fr; }
.row.cols-2 { grid-template-columns: 1fr 1fr; }
.cell {
  border: 1px solid #e5ddd4;
  border-radius: 4px;
  padding: 5px;
  page-break-inside: avoid;
  break-inside: avoid;
}
.cell-no { font-size: 10px; color: #8a8178; margin-bottom: 3px; }
.crop {
  position: relative;
  overflow: hidden;
  background: #fbfaf6;
  width: 100%;
}
.crop img, .crop svg {
  display: block;
  width: 100%;
  height: auto;
}
.crop.css-crop img {
  position: absolute;
  max-width: none;
}
.mask {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 55%;
  background: #fff;
  box-shadow: inset 0 1px 0 #e8e0d6;
}
.mask-corner {
  position: absolute;
  top: 0;
  right: 0;
  width: 30%;
  height: 18%;
  background: #fff;
}
.foot {
  margin-top: 6px;
  text-align: center;
  font-size: 10px;
  color: #6b7280;
}
@media print {
  html, body { background: #fff; }
  .sheet { margin: 0; box-shadow: none; }
  .row, .cell { page-break-inside: avoid; break-inside: avoid; }
}
</style>
</head>
<body>

    <section class="sheet">
      <header class="sheet-head">
        <div class="brand">MARU 家庭学習</div>
        <h1 class="title">8月26日のまとめプリント</h1>
        <div class="meta-print">
          <span>なまえ: はると</span>
          <span>2026年8月26日</span>
        </div>
      </header>
      <div class="body"><div class="row cols-2"><article class="cell">
    <div class="cell-no">(1)</div>
    <div class="crop" style="aspect-ratio: 0.88 / 0.18;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 164" width="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="800" height="164" fill="#fbfaf6"/>
    <rect x="10" y="10" width="780" height="144" fill="none" stroke="#e4dacd"/>
  </svg><div class="mask"></div><div class="mask-corner"></div></div>
  </article><article class="cell">
    <div class="cell-no">(2)</div>
    <div class="crop" style="aspect-ratio: 0.44 / 0.12;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 218" width="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="800" height="218" fill="#fbfaf6"/>
    <rect x="10" y="10" width="780" height="198" fill="none" stroke="#e4dacd"/>
  </svg><div class="mask"></div><div class="mask-corner"></div></div>
  </article></div><div class="row cols-1"><article class="cell">
    <div class="cell-no">(3)</div>
    <div class="crop" style="aspect-ratio: 0.88 / 0.15;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="800" height="140" fill="#fbfaf6"/>
    <rect x="10" y="10" width="780" height="120" fill="none" stroke="#e4dacd"/>
  </svg><div class="mask"></div><div class="mask-corner"></div></div>
  </article></div><div class="row cols-1"><article class="cell">
    <div class="cell-no">(4)</div>
    <div class="crop css-crop" style="aspect-ratio: 0.9 / 0.58;"><img alt="" src="https://example.com/scan.jpg" style="width:111.11111111111111%;height:172.41379310344828%;left:-5.555555555555556%;top:-34.48275862068966%;" /><div class="mask"></div><div class="mask-corner"></div></div>
  </article></div></div>
      <footer class="foot">1/1</footer>
    </section>
</body>
</html>
