<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>混合</title>
  <style>
@page { size: A4 portrait; margin: 10mm; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #ece7df;
  color: #1f2933;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
.sheet {
  width: 210mm;
  height: 297mm;
  margin: 0 auto 8mm;
  padding: 10mm;
  background: #fff;
  display: flex;
  flex-direction: column;
  page-break-after: always;
  break-after: page;
}
.sheet:last-child { page-break-after: auto; break-after: auto; }
.sheet-head {
  border-bottom: 2px solid #c44738;
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.brand { font-size: 10px; letter-spacing: 0.18em; color: #c44738; font-weight: 700; }
.title { font-size: 16px; margin: 2px 0 6px; font-weight: 700; }
.fields {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: #5b6570;
}
.fields label { display: flex; align-items: center; gap: 6px; }
.fields .line {
  display: inline-block;
  min-width: 42mm;
  border-bottom: 1px solid #1f2933;
  height: 14px;
}
.grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 6px 10px;
  min-height: 0;
}
.cell {
  border: 1px solid #d7cfc3;
  border-radius: 4px;
  padding: 6px 8px 8px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  break-inside: avoid;
  page-break-inside: avoid;
}
.stem {
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: 0.02em;
}
.answer-row {
  margin-top: 6px;
  font-size: 14px;
  letter-spacing: 0.12em;
}
.blank {
  display: inline-block;
  min-width: 28mm;
  padding: 2px 8px 0;
  border-bottom: 1.5px solid #1f2933;
  line-height: 1.2;
}
.memo {
  flex: 1;
  min-height: 12mm;
  margin-top: 6px;
  border-radius: 3px;
  background:
    repeating-linear-gradient(#fff 0 6.2mm, #eee8e0 6.2mm 6.45mm);
  border: 1px solid #eee8e0;
}
.foot {
  margin-top: 6px;
  text-align: center;
  font-size: 10px;
  color: #6b7280;
}
@media print {
  html, body { background: #fff; }
  .sheet { margin: 0; box-shadow: none; }
}
</style>
</head>
<body>

    <section class="sheet">
      <header class="sheet-head">
        <div class="brand">MARU 家庭学習</div>
        <h1 class="title">混合</h1>
        <div class="fields">
          <label>日付<span class="line"></span></label>
          <label>なまえ<span class="line"></span></label>
        </div>
      </header>
      <div class="grid">
        <article class="cell">
    <div class="stem">(1) 52 − 18 = </div>
    <div class="answer-row">[ <span class="blank"></span> ]</div>
    <div class="memo"></div>
  </article><article class="cell">
    <div class="stem">(2) 36 + 27 = </div>
    <div class="answer-row">[ <span class="blank"></span> ]</div>
    <div class="memo"></div>
  </article><article class="cell">
    <div class="stem">(3) 8 × 9 = </div>
    <div class="answer-row">[ <span class="blank"></span> ]</div>
    <div class="memo"></div>
  </article><article class="cell">
    <div class="stem">(4) 72 ÷ 8 = </div>
    <div class="answer-row">[ <span class="blank"></span> ]</div>
    <div class="memo"></div>
  </article><article class="cell">
    <div class="stem">(5) つるとかめが合わせて10ひきいます。足は全部で34本です。それぞれ何ひき？</div>
    <div class="answer-row">[ <span class="blank"></span> ]</div>
    <div class="memo"></div>
  </article>
      </div>
      <footer class="foot">1/1</footer>
    </section>
</body>
</html>
